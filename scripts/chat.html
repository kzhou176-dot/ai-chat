<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>aichat-hub · 浏览器对话</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #0f1419;
    --bg-elev: #1a2028;
    --bg-msg-user: #2563eb;
    --bg-msg-ai: #2a3441;
    --text: #e6edf3;
    --text-dim: #8b949e;
    --accent: #58a6ff;
    --border: #30363d;
    --success: #3fb950;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  header {
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 12px;
  }
  header h1 {
    font-size: 18px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  header h1::before {
    content: "🤖";
    font-size: 22px;
  }
  .header-info {
    font-size: 12px;
    color: var(--text-dim);
  }

  .persona-bar {
    background: var(--bg-elev);
    border-bottom: 1px solid var(--border);
    padding: 12px 24px;
    display: flex;
    gap: 8px;
    overflow-x: auto;
  }
  .persona-chip {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 6px 14px;
    font-size: 13px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.2s;
  }
  .persona-chip:hover { border-color: var(--accent); }
  .persona-chip.active {
    background: var(--accent);
    color: white;
    border-color: var(--accent);
  }

  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 24px;
    display: flex;
    flex-direction: column;
    gap: 16px;
  }

  .msg {
    display: flex;
    gap: 12px;
    max-width: 80%;
    animation: fadeIn 0.3s ease;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg-avatar {
    width: 36px;
    height: 36px;
    border-radius: 50%;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    flex-shrink: 0;
  }
  .msg.user .msg-avatar { background: var(--bg-msg-user); }
  .msg-body {
    background: var(--bg-msg-ai);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 14px;
    line-height: 1.6;
    word-wrap: break-word;
    white-space: pre-wrap;
  }
  .msg.user .msg-body { background: var(--bg-msg-user); }
  .msg-meta {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .msg.user .msg-meta { text-align: right; }

  .typing {
    display: inline-block;
    width: 6px;
    height: 6px;
    background: var(--text-dim);
    border-radius: 50%;
    margin: 0 2px;
    animation: bounce 1.4s infinite;
  }
  .typing:nth-child(2) { animation-delay: 0.2s; }
  .typing:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-4px); opacity: 1; }
  }

  .input-area {
    background: var(--bg-elev);
    border-top: 1px solid var(--border);
    padding: 16px 24px;
    display: flex;
    gap: 12px;
    align-items: flex-end;
  }
  #input {
    flex: 1;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 14px;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: none;
    min-height: 44px;
    max-height: 200px;
    outline: none;
  }
  #input:focus { border-color: var(--accent); }
  #send {
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 12px;
    padding: 10px 20px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  #send:hover { opacity: 0.85; }
  #send:disabled { opacity: 0.4; cursor: not-allowed; }

  .empty-state {
    text-align: center;
    padding: 60px 24px;
    color: var(--text-dim);
  }
  .empty-state h2 { font-size: 24px; margin-bottom: 8px; }
  .empty-state p { font-size: 14px; line-height: 1.8; }

  .err {
    background: #da3633;
    color: white;
    padding: 8px 12px;
    border-radius: 8px;
    font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <h1>aichat-hub · 浏览器对话</h1>
  <div class="header-info">
    <span id="serverStatus">● 检测中...</span>
    ·
    <span id="endpointCount">74 endpoints</span>
    ·
    <a href="http://127.0.0.1:8765/api/dashboard/html" style="color:var(--accent);text-decoration:none">Dashboard →</a>
  </div>
</header>

<div class="persona-bar" id="personaBar"></div>

<div id="messages">
  <div class="empty-state">
    <h2>👋 选个角色开始聊</h2>
    <p>这是一个真实的对话界面,接入了 aichat-hub 的 LLM 接口。<br>
    无 LLM key 时使用 mock 回复(根据 persona 性格定制)。<br><br>
    <strong>试试:</strong>「你好」「我最近有点焦虑」「切换角色」</p>
  </div>
</div>

<div class="input-area">
  <textarea id="input" placeholder="输入消息,Enter 发送,Shift+Enter 换行..." rows="1"></textarea>
  <button id="send">发送</button>
</div>

<script>
const API = "http://127.0.0.1:8765";
let currentPersona = "xiaoai";
let isTyping = false;

// 加载 personas
async function loadPersonas() {
  try {
    const r = await fetch(`${API}/api/personas`);
    const d = await r.json();
    const bar = document.getElementById("personaBar");
    bar.innerHTML = "";
    (d.personas || []).forEach(pid => {
      const chip = document.createElement("div");
      chip.className = "persona-chip" + (pid === currentPersona ? " active" : "");
      chip.textContent = pid;
      chip.onclick = () => switchPersona(pid);
      bar.appendChild(chip);
    });
  } catch (e) {
    document.getElementById("serverStatus").innerHTML = "● 离线";
    document.getElementById("serverStatus").style.color = "var(--err, #da3633)";
  }
}

function switchPersona(pid) {
  currentPersona = pid;
  document.querySelectorAll(".persona-chip").forEach(c => {
    c.classList.toggle("active", c.textContent === pid);
  });
  addMsg("system", `已切换到 ${pid}`, "");
}

async function send() {
  const input = document.getElementById("input");
  const text = input.value.trim();
  if (!text || isTyping) return;
  isTyping = true;
  document.getElementById("send").disabled = true;
  addMsg("user", text, "");
  input.value = "";
  input.style.height = "auto";
  // typing 指示
  const typingEl = addMsg("assistant", `<span class="typing"></span><span class="typing"></span><span class="typing"></span>`, "");
  try {
    const r = await fetch(`${API}/api/chat`, {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({ persona: currentPersona, message: text }),
    });
    const d = await r.json();
    typingEl.remove();
    if (d.error) {
      addMsg("error", `❌ ${d.error}`, "");
    } else {
      addMsg("assistant", d.content || d.answer || "(空回复)",
        d.model ? `${d.model} · ${d.usage?.total_tokens || 0} tokens` : "");
    }
  } catch (e) {
    typingEl.remove();
    addMsg("error", `❌ 网络错误: ${e.message}`, "");
  } finally {
    isTyping = false;
    document.getElementById("send").disabled = false;
  }
}

function addMsg(role, text, meta) {
  const messages = document.getElementById("messages");
  // 清空欢迎
  if (messages.querySelector(".empty-state")) {
    messages.innerHTML = "";
  }
  const div = document.createElement("div");
  div.className = "msg " + (role === "user" ? "user" : role === "error" ? "assistant" : "assistant");
  const avatar = role === "user" ? "我" : role === "system" ? "ℹ️" : role === "error" ? "⚠️" : "🤖";
  const body = document.createElement("div");
  body.innerHTML = `
    <div class="msg-avatar">${avatar}</div>
    <div>
      <div class="msg-body">${escapeHtml(text)}</div>
      ${meta ? `<div class="msg-meta">${meta}</div>` : ""}
    </div>
  `;
  div.appendChild(body);
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
  return div;
}

function escapeHtml(s) {
  const d = document.createElement("div");
  d.textContent = s;
  return d.innerHTML;
}

// 事件
document.getElementById("send").onclick = send;
document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) {
    e.preventDefault();
    send();
  }
  // 自动高度
  e.target.style.height = "auto";
  e.target.style.height = Math.min(e.target.scrollHeight, 200) + "px";
});

// 启动
loadPersonas();
setInterval(async () => {
  try {
    const r = await fetch(`${API}/api/personas`, { method: "GET" });
    document.getElementById("serverStatus").innerHTML = r.ok ? "● 在线" : "● 离线";
    document.getElementById("serverStatus").style.color = r.ok ? "var(--success)" : "#da3633";
  } catch (e) {
    document.getElementById("serverStatus").innerHTML = "● 离线";
  }
}, 5000);
</script>
</body>
</html>
