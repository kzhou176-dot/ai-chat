name: test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show Python info
        run: |
          python --version
          which python
          pip --version

      - name: Install dependencies
        run: |
          # 项目只用 stdlib,不需要 pip install
          # 但要 pip 自带以保证 pytest 可用
          python -m pip install --upgrade pip
          python -m pip install pytest

      - name: Run tests
        run: |
          # 显式 PYTHONPATH 让 scripts/ 可 import
          PYTHONPATH=scripts python3 -m pytest tests/ -v --tb=short
        env:
          # 防止 macOS-only 测试在 linux 失败
          CI: "true"

      - name: Run smoke test (web endpoints, 10 req each)
        run: |
          # 启动 server 后台
          PYTHONPATH=scripts python3 scripts/web.py &
          SERVER_PID=$!
          sleep 3
          # 烟雾测试 26 endpoint
          PYTHONPATH=scripts python3 -m pytest tests/test_24_benchmark.py -v --tb=short
          # 关闭 server
          kill $SERVER_PID 2>/dev/null || true

  lint:
    name: Lint (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check (syntax)
        run: |
          python3 -m compileall -q scripts/ tests/
          echo "✓ All Python files compile cleanly"

      - name: Import smoke test
        run: |
          PYTHONPATH=scripts python3 -c "import web, persona, llm_client, memory, scene, benchmark, desktop_app, repl, e2e_demo; print(f'OK {len(web.ROUTES)} routes')"
