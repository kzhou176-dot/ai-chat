name: release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build + Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Build DEB (multi-arch)
        run: |
          # 在 Linux runner 上构建(BSD ar 在 macOS 上不工作)
          for arch in all amd64 arm64 armhf; do
            bash packaging/build_deb.sh $arch
          done
          ls -lah dist/*.deb

      - name: Run tests
        run: |
          python3 -m pip install --upgrade pip pytest
          PYTHONPATH=scripts python3 -m pytest tests/ -v --tb=short

      - name: Extract version from tag
        id: version
        run: |
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for v$VERSION"

      - name: Extract CHANGELOG section
        id: changelog
        run: |
          # 提取最新版本的 changelog 段
          python3 - <<EOF
          import re
          with open("CHANGELOG.md") as f:
              text = f.read()
          m = re.search(rf"## \[v{'$VERSION'}\][^\n]*\n(.*?)(?=\n## |\Z)", text, re.DOTALL)
          if m:
              print(m.group(1).strip())
          else:
              print("See CHANGELOG.md for details")
          EOF > RELEASE_BODY.md
          cat RELEASE_BODY.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "v${{ steps.version.outputs.VERSION }}"
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: ${{ contains(steps.version.outputs.VERSION, '-rc') || contains(steps.version.outputs.VERSION, '-alpha') || contains(steps.version.outputs.VERSION, '-beta') }}
          files: |
            dist/*.deb
          # DMG 是 macOS-only artifact,不在 linux runner 上 build
          # 本地手动 build + 上传:
          #   bash packaging/build_macos.sh
          #   gh release upload v${{ steps.version.outputs.VERSION }} dist/*.dmg
